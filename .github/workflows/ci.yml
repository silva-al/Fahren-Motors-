name: Fahren Parts CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar suíte de testes automatizados (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: teste_jwt_secret_ci_super_segura_com_32_chars_123456

      - name: Compilar artefatos de produção
        run: npm run build

      - name: Validar integridade dos artefatos em dist/
        run: |
          test -f dist/index.html || exit 1
          test -f dist/admin/index.html || exit 1
          test -f dist/loja.js || exit 1
          test -f dist/admin/admin.js || exit 1
          echo "Build e artefatos validados com sucesso!"
